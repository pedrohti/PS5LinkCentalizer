name: Update versions

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
    paths: [projects.json, scripts/update.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/update.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dead repos are moved from projects.json to offline.json by the script
      - name: Commit if changed
        run: |
          git add data.json projects.json offline.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update versions"
          git push
